# اسم بيئة العمل الخاصة بمشروع فلاتر
name: Flutter CI

# محفزات التشغيل عند الدفع أو سحب الكود لفرع main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # للتشغيل اليدوي

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. نسخ كود المشروع داخل السيرفر الافتراضي
      - uses: actions/checkout@v4

      # 2. تثبيت جافا (مطلوبة لبناء تطبيقات أندرويد)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. تثبيت فلاتر وإعداد البيئة تلقائياً
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. تحميل حزم ومكتبات المشروع (Dependencies)
      - name: Install dependencies
        run: flutter pub get

      # 5. فحص جودة الكود والتأكد من عدم وجود أخطاء صياغة (اختياري)
      - name: Analyze code
        run: flutter analyze

      # 6. اختبارات المشروع: تم إيقافها مؤقتاً لأن المشروع لا يحتوي على مجلد test/
      # - name: Run tests
      #   run: flutter test

      # 7. بناء نسخة الأندرويد APK
      - name: Build APK
        run: flutter build apk --release
